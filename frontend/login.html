<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Complaint Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: url('campus_bg.jpg') center center / cover no-repeat;
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            color: white;
        }

        /* --- Header & Footer Elements --- */
        .top-left {
            position: absolute; top: 30px; left: 40px;
            display: flex; align-items: center; gap: 15px;
        }
        .top-left svg { fill: white; width: 40px; height: 40px; }
        .top-left-text { font-size: 18px; font-weight: 600; line-height: 1.3; }

        .top-right {
            position: absolute; top: 40px; right: 40px;
            font-size: 15px; font-weight: 500; letter-spacing: 0.5px;
        }

        .bottom-left {
            position: absolute; bottom: 30px; left: 40px;
            display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500;
        }
        .bottom-left svg { fill: white; width: 20px; height: 20px; }

        /* --- Login Card Elements --- */
        .login-card { 
            background: rgba(244, 247, 250, 0.95); 
            padding: 40px; border-radius: 12px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
            width: 100%; max-width: 450px; text-align: center; 
            color: #333;
            backdrop-filter: blur(5px);
        }
        
        .card-icon { fill: #164e8e; width: 40px; height: 40px; margin-bottom: 10px; }
        
        h2 { color: #164e8e; font-size: 24px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .form-group { position: relative; margin-bottom: 20px; text-align: left; }
        
        /* Input Fields with Icons */
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: #666; pointer-events: none; }
        
        .eye-icon { 
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%); 
            width: 20px; height: 20px; fill: #888; cursor: pointer; 
            transition: fill 0.2s ease;
            user-select: none;
        }
        .eye-icon:hover { fill: #164e8e; }
        
        input[type="email"], input[type="text"], input[type="password"] { 
            width: 100%; padding: 14px 45px 14px 45px; 
            border: 1px solid #ddd; border-radius: 8px; 
            font-size: 14px; background: white; transition: 0.3s;
        }
        input:focus { border-color: #164e8e; outline: none; box-shadow: 0 0 5px rgba(22, 78, 142, 0.2); }
        
        .options-row { display: flex; align-items: center; font-size: 13px; color: #555; margin-bottom: 20px; }
        .options-row input[type="checkbox"] { margin-right: 8px; }
        
        button { 
            background: #164e8e; color: white; border: none; padding: 14px; 
            width: 100%; font-size: 16px; border-radius: 8px; cursor: pointer; 
            font-weight: 600; transition: background 0.3s ease; 
        }
        button:hover { background: #113a6b; }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #999; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #ddd; }
        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }
        
        .link-text { display: block; font-size: 13px; color: #666; }
        .link-text a { color: #007bff; text-decoration: none; font-weight: 600; }
        .link-text a:hover { text-decoration: underline; }
        
        #errorMessage { margin-top: 15px; font-weight: 600; font-size: 13px; min-height: 18px; color: #e74c3c; }
    </style>
</head>
<body>

    <div class="top-left">
        <svg viewBox="0 0 24 24"><path d="M4 10h3v7H4zM10.5 10h3v7h-3zM2 19h20v3H2zM17 10h3v7h-3zM12 1L2 6v2h20V6z"/></svg>
        <div class="top-left-text">Campus Complaint<br>Management System</div>
    </div>

    <div class="top-right">
        Better Campus &nbsp;|&nbsp; Better Tomorrow
    </div>

    <div class="bottom-left">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Report &nbsp;|&nbsp; Track &nbsp;|&nbsp; Resolve
    </div>

    <div class="login-card">
        <svg class="card-icon" viewBox="0 0 24 24"><path d="M4 10h3v7H4zM10.5 10h3v7h-3zM2 19h20v3H2zM17 10h3v7h-3zM12 1L2 6v2h20V6z"/></svg>
        <h2>Campus Complaint<br>Management System</h2>
        <p class="subtitle">Login to your account</p>
        
        <form id="smartLoginForm">
            <div class="form-group">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="email" id="email" placeholder="Email or Username" required>
            </div>

            <div class="form-group">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" id="password" placeholder="Password" required>
                <!-- Functional Toggle Eye Icon -->
                <svg id="togglePassword" class="eye-icon" viewBox="0 0 24 24" title="Toggle password visibility">
                    <path id="eyePath" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>

            <div class="options-row">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin:0;">Remember me</label>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="divider">OR</div>

        <span class="link-text">
            Don't have an account? <a href="register.html">Sign up</a>
        </span>
        
        <p id="errorMessage"></p>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyePath = document.getElementById("eyePath");

        const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeSlashedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        togglePassword.addEventListener("click", function() {
            const isPassword = passwordInput.getAttribute("type") === "password";
            if (isPassword) {
                passwordInput.setAttribute("type", "text");
                eyePath.setAttribute("d", eyeSlashedPath);
            } else {
                passwordInput.setAttribute("type", "password");
                eyePath.setAttribute("d", eyeOpenPath);
            }
        });

        // Authentication Submission Logic
        document.getElementById("smartLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorTag = document.getElementById("errorMessage");
            errorTag.innerText = "Authenticating...";
            errorTag.style.color = "#164e8e";

            const formData = new URLSearchParams();
            formData.append("email", email);
            formData.append("password", password);

            fetch("http://localhost:8080/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(response => {
                if (response.startsWith("admin")) {
                    sessionStorage.setItem("isAdminLoggedIn", "true");
                    window.location.href = "admin.html";
                } else if (response.startsWith("student")) {
                    const parts = response.split("|");
                    sessionStorage.setItem("isStudentLoggedIn", "true");
                    sessionStorage.setItem("studentEmail", email);
                    sessionStorage.setItem("studentName", parts[1] || "Student");
                    window.location.href = "index.html";
                } else {
                    errorTag.style.color = "#e74c3c";
                    errorTag.innerText = "Invalid credentials. Please try again.";
                }
            })
            .catch(() => {
                errorTag.style.color = "#e74c3c";
                errorTag.innerText = "Cannot connect to C++ server!";
            });
        });
    </script>
</body>
</html>
