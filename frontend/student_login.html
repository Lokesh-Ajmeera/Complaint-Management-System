<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Complaint System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .link-text { margin-top: 15px; display: block; font-size: 14px; color: #666; }
        .link-text a { color: #3498db; text-decoration: none; font-weight: bold; }
        #errorMessage { color: #e74c3c; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Student Login</h2>
        <form id="studentLoginForm">
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="roll_number" placeholder="e.g., 23CSE101" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <span class="link-text">Don't have an account? <a href="register.html">Register here</a></span>
        <p id="errorMessage"></p>
    </div>

    <script>
        document.getElementById("studentLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const roll = document.getElementById("roll_number").value;
            const pass = document.getElementById("password").value;
            const errorTag = document.getElementById("errorMessage");

            const formData = new URLSearchParams();
            formData.append("roll_number", roll);
            formData.append("password", pass);

            fetch("http://localhost:8080/api/student/login", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(response => {
                if (response === "Success") {
                    sessionStorage.setItem("isStudentLoggedIn", "true");
                    sessionStorage.setItem("studentRoll", roll);
                    window.location.href = "index.html"; // Go to submission form
                } else {
                    errorTag.innerText = "Invalid Roll Number or Password!";
                }
            })
            .catch(err => {
                errorTag.innerText = "Cannot connect to C++ server!";
            });
        });
    </script>
</body>
</html>
