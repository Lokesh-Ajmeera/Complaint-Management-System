<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Campus System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; 
        }
        .main-wrapper {
            display: flex;
            width: 900px;
            height: 560px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /* Left Brand Panel */
        .brand-panel {
            flex: 1;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .brand-icon {
            font-size: 48px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 50%;
        }
        .brand-panel h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
        .brand-panel p { font-size: 14px; opacity: 0.9; letter-spacing: 0.5px; }

        /* Right Form Panel */
        .form-panel {
            flex: 1;
            padding: 40px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-panel h2 { color: #11998e; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; font-size: 13px; }
        input { 
            width: 100%; padding: 11px 14px; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 14px; transition: all 0.3s ease;
        }
        input:focus { border-color: #11998e; outline: none; box-shadow: 0 0 5px rgba(17, 153, 142, 0.2); }
        
        /* Password wrapper and toggle eye icon */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .eye-icon { 
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); 
            width: 20px; height: 20px; fill: #888; cursor: pointer; 
            transition: fill 0.2s ease;
            user-select: none;
        }
        .eye-icon:hover { fill: #11998e; }

        button { 
            background: #11998e; color: white; border: none; padding: 12px; 
            width: 100%; font-size: 15px; border-radius: 8px; cursor: pointer; 
            font-weight: 600; transition: background 0.3s ease; margin-top: 5px;
        }
        button:hover { background: #0e8076; }
        
        .link-text { margin-top: 15px; display: block; font-size: 13px; color: #666; text-align: center; }
        .link-text a { color: #11998e; text-decoration: none; font-weight: 600; }
        .link-text a:hover { text-decoration: underline; }
        #message { margin-top: 12px; font-weight: 600; font-size: 13px; text-align: center; min-height: 18px; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Left Brand Banner -->
        <div class="brand-panel">
            <div class="brand-icon">📝</div>
            <h1>Student Portal Registration</h1>
            <p>Report issues, track progress, and build a better campus together.</p>
        </div>

        <!-- Right Register Form -->
        <div class="form-panel">
            <h2>Create Account</h2>
            <p class="subtitle">Sign up with your student credentials</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Email ID</label>
                    <input type="email" id="email" placeholder="name@college.com" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="student_name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create a secure password" required>
                        <svg id="togglePassword" class="eye-icon" viewBox="0 0 24 24" title="Toggle password visibility">
                            <path id="eyePath" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                </div>
                <button type="submit">Register Account</button>
            </form>

            <span class="link-text">Already have an account? <a href="login.html">Login here</a></span>
            <p id="message"></p>
        </div>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyePath = document.getElementById("eyePath");

        const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeSlashedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        togglePassword.addEventListener("click", function() {
            const isPassword = passwordInput.getAttribute("type") === "password";
            if (isPassword) {
                passwordInput.setAttribute("type", "text");
                eyePath.setAttribute("d", eyeSlashedPath);
            } else {
                passwordInput.setAttribute("type", "password");
                eyePath.setAttribute("d", eyeOpenPath);
            }
        });

        // Form Submission Logic
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const name = document.getElementById("student_name").value;
            const pass = document.getElementById("password").value;
            const msgTag = document.getElementById("message");

            const formData = new URLSearchParams();
            formData.append("email", email);
            formData.append("student_name", name);
            formData.append("password", pass);

            fetch("http://localhost:8080/api/student/register", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            })
            .then(res => res.text())
            .then(response => {
                if (response === "Success") {
                    msgTag.style.color = "#11998e";
                    msgTag.innerText = "Registration successful! Redirecting to login...";
                    setTimeout(() => window.location.href = "login.html", 1500);
                } else {
                    msgTag.style.color = "#e74c3c";
                    msgTag.innerText = response;
                }
            })
            .catch(() => {
                msgTag.style.color = "#e74c3c";
                msgTag.innerText = "Cannot connect to C++ server!";
            });
        });
    </script>
</body>
</html>
